<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gotham Night Shift - Prototype</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#090b10;color:#e8e8e8;font-family:Arial,Helvetica,sans-serif}
  .wrap{max-width:1100px;margin:auto;padding:20px}
  header{border-bottom:1px solid #343844;padding-bottom:15px;margin-bottom:18px}
  h1{margin:0 0 5px;font-size:30px;letter-spacing:2px}
  .sub{color:#9298a7}
  .layout{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
  .panel{background:#11141c;border:1px solid #292e3b;border-radius:10px;padding:16px;box-shadow:0 10px 30px #0006}
  .scene{min-height:430px}
  h2{margin-top:0;font-size:20px}
  .location{color:#8fb7ff;font-size:13px;text-transform:uppercase;letter-spacing:1px}
  .clue{background:#181c25;border-left:3px solid #8fb7ff;padding:10px;margin:8px 0;border-radius:5px}
  .choices{display:grid;gap:9px;margin-top:18px}
  button{background:#202634;color:#fff;border:1px solid #3a4253;padding:11px 13px;border-radius:7px;cursor:pointer;text-align:left}
  button:hover{background:#2b3344}
  button:disabled{opacity:.45;cursor:not-allowed}
  .stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #252a34}
  .bar{height:7px;background:#242936;border-radius:99px;overflow:hidden;margin-top:5px}
  .fill{height:100%;background:#8fb7ff}
  .evidence{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .tag{background:#222938;border:1px solid #3a4253;padding:5px 8px;border-radius:20px;font-size:12px}
  .board{min-height:160px}
  .link{margin:8px 0;padding:8px;background:#191e28;border-radius:6px}
  .success{color:#8fe0a5}.danger{color:#ff8c8c}.muted{color:#9298a7}
  .hidden{display:none}
  .ending{text-align:center;padding:30px;animation:fadeIn .7s ease-out}@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .ending h2{font-size:27px}
  @media(max-width:800px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>GOTHAM NIGHT SHIFT</h1>
  <div class="sub">A detective mystery prototype • Case 01: The Black Lantern</div>
</header>

<div id="game" class="layout">
  <main class="panel scene">
    <div id="location" class="location"></div>
    <h2 id="title"></h2>
    <p id="text"></p>
    <div id="clues"></div>
    <div id="choices" class="choices"></div>
  </main>

  <aside class="panel">
    <h2>Detective File</h2>
    <div class="stat"><span>Time</span><strong id="time">11:00 PM</strong></div>
    <div class="stat"><span>Case Progress</span><strong id="progress">0%</strong></div>
    <div class="stat"><span>Reputation</span><strong id="rep">0</strong></div>
    <div style="margin:8px 0 16px"><div class="bar"><div id="progressBar" class="fill" style="width:0%"></div></div></div>

    <h3>Evidence Collected</h3>
    <div id="evidence" class="evidence"><span class="muted">Nothing yet.</span></div>

    <h3>Link Board</h3>
    <div id="board" class="board"><span class="muted">Connect clues to build a theory.</span></div>

    <button id="reset" style="width:100%;margin-top:10px">Restart Case</button>
  </aside>
</div>

<div id="ending" class="panel ending hidden"></div>
</div>

<script>
const state = {
  node:"scene",
  time:23*60,
  rep:0,
  evidence:[],
  links:[],
  flags:{},
  done:false
};

const scenes = {
  scene:{
    location:"Crime Scene • Black Lantern Alley",
    title:"Rain, blood, and a locked door",
    text:"A local accountant, Elias Vane, is dead behind a locked service door. There are no obvious signs of forced entry. A police officer waits for your report, but something about the scene feels staged.",
    clues:["The victim's watch stopped at 10:42 PM.","A black thread is caught on the door latch.","There is a faint chemical smell near the body."],
    choices:[
      ["Inspect the body", "body"],
      ["Examine the door and lock", "door"],
      ["Search the alley", "alley"]
    ]
  },
  body:{
    location:"Crime Scene",
    title:"Something was taken",
    text:"The victim has a shallow wound, but it isn't what killed him. A tiny puncture is visible behind his ear. His wallet is untouched. A folded receipt is hidden inside his sleeve.",
    clues:["Receipt: 'Mercy Docks — Storage 17'","Tiny puncture behind the ear","Wallet untouched"],
    evidence:["Receipt: Mercy Docks","Puncture wound"],
    choices:[
      ["Go to Mercy Docks", "docks"],
      ["Return to the door", "door"],
      ["Question the patrol officer", "officer"]
    ]
  },
  door:{
    location:"Crime Scene • Service Door",
    title:"A lock with no break-in",
    text:"The lock is intact, but the black thread matches a cheap suit fabric. You notice a nearly invisible smear around the keyhole. It smells like industrial lubricant.",
    clues:["Black suit thread","Lubricant smear","No forced entry"],
    evidence:["Black suit thread","Lubricant smear"],
    choices:[
      ["Inspect the alley", "alley"],
      ["Question the patrol officer", "officer"],
      ["Return to the body", "body"]
    ]
  },
  alley:{
    location:"Black Lantern Alley",
    title:"Footprints in the rain",
    text:"Fresh rain has erased most tracks, but one set of heavy boot prints leads toward a maintenance gate. Near it sits a torn security badge.",
    clues:["Heavy boot prints","Torn badge: GCPD Auxiliary","Gate leads toward the waterfront"],
    evidence:["GCPD Auxiliary badge","Boot prints"],
    choices:[
      ["Question the patrol officer", "officer"],
      ["Follow the waterfront route", "docks"],
      ["Return to the body", "body"]
    ]
  },
  officer:{
    location:"Crime Scene",
    title:"The patrol officer gets defensive",
    text:"Officer Mercer claims he arrived after the murder. When you mention the auxiliary badge, he becomes visibly nervous. He says the badge must have belonged to someone from an old security detail.",
    clues:["Mercer avoids eye contact.","His boots match the alley prints.","He knows about the badge before you show it."],
    choices:[
      ["Accuse Mercer", "accuse"],
      ["Pretend to believe him", "trust"],
      ["Ask about Mercy Docks", "docks"]
    ]
  },
  docks:{
    location:"Mercy Docks • Storage 17",
    title:"The second crime scene",
    text:"Storage 17 is unlocked. Inside you find boxes of stolen medical equipment and a wall covered in photographs of city officials. One photograph has Elias Vane circled in red.",
    clues:["Stolen medical equipment","Photos of city officials","Vane's photograph is circled"],
    evidence:["Stolen medical equipment","Conspiracy wall"],
    choices:[
      ["Search the desk", "desk"],
      ["Call for backup", "backup"],
      ["Confront the person outside", "warehouse"]
    ]
  },
  desk:{
    location:"Mercy Docks • Storage 17",
    title:"The ledger",
    text:"A hidden ledger lists payments to an organization called NIGHTFALL. Several payments are signed with the initials M.M. One final entry reads: 'Vane became unreliable. Remove him.'",
    clues:["NIGHTFALL ledger","Initials: M.M.","Vane was targeted for becoming unreliable"],
    evidence:["NIGHTFALL ledger","Initials M.M."],
    choices:[
      ["Confront the person outside", "warehouse"],
      ["Call for backup", "backup"],
      ["Build a theory", "board"]
    ]
  },
  backup:{
    location:"Mercy Docks",
    title:"No one answers",
    text:"You call the precinct. Static. Then a short message comes through: 'Don't trust the radio.' Someone is interfering with police communications.",
    clues:["Police communications are compromised","Someone knows your investigation"],
    evidence:["Compromised radio"],
    choices:[
      ["Confront the person outside", "warehouse"],
      ["Build a theory", "board"]
    ]
  },
  warehouse:{
    location:"Mercy Docks • Loading Yard",
    title:"The suspect runs",
    text:"A masked figure spots you and bolts. You chase them through the loading yard. You can tackle them now, or let them run and follow them to whoever is giving the orders.",
    choices:[
      ["Tackle the suspect", "tackle"],
      ["Let them run", "follow"]
    ]
  },
  tackle:{
    location:"Loading Yard",
    title:"You caught the courier",
    text:"The courier drops a phone. The lock screen shows a message from 'M.M.': 'Mercer says the detective is asking questions.' You have your suspect—but the message suggests someone inside the police department is directing the operation.",
    evidence:["Courier phone","Message from M.M."],
    choices:[
      ["Build a theory", "board"]
    ]
  },
  follow:{
    location:"Waterfront",
    title:"The trail leads higher",
    text:"You follow the courier without being seen. They enter a black sedan. Through the windshield you recognize Commissioner Mallory, a respected figure at the precinct. The courier hands her the ledger.",
    evidence:["Commissioner Mallory sighting","Courier met Mallory"],
    choices:[
      ["Confront Mallory", "mallory"],
      ["Build a theory", "board"]
    ]
  },
  mallory:{
    location:"Waterfront",
    title:"The commissioner turns",
    text:"Mallory sees you. Her expression changes immediately. She reaches for a weapon, but you already have enough evidence to expose NIGHTFALL. The case is no longer just a murder investigation—it is a corruption scandal reaching the top of the department.",
    choices:[
      ["Build a theory", "board"]
    ]
  },
  accuse:{
    location:"Crime Scene",
    title:"Too soon",
    text:"You accuse Mercer without enough evidence. He reaches for his radio and calls you in as a suspect interfering with an active investigation. You lose the scene and the trail goes cold.",
    choices:[["Try again", "scene"]]
  },
  trust:{
    location:"Crime Scene",
    title:"A dangerous bluff",
    text:"You pretend to believe Mercer. He relaxes and accidentally reveals that he knows the victim visited Mercy Docks. You now have enough to continue, but Mercer realizes you are watching him.",
    evidence:["Mercer knows about Mercy Docks"],
    choices:[["Go to Mercy Docks", "docks"]]
  },
  board:{
    location:"Detective's Link Board",
    title:"Build the theory",
    text:"You spread the evidence across the board. The strongest theory connects the victim, NIGHTFALL, the auxiliary badge, and the police department. Decide whether you have enough to close the case.",
    choices:[
      ["Connect the murder to NIGHTFALL", "linkNightfall"],
      ["Connect Mercer to the murder", "linkMercer"],
      ["Connect the conspiracy to Commissioner Mallory", "linkMallory"]
    ]
  },
  linkNightfall:{
    location:"Link Board",
    title:"Connection established",
    text:"Vane was killed because he became unreliable. NIGHTFALL wanted him removed. The stolen equipment and ledger prove the organization is real.",
    choices:[["Continue connecting clues", "board"]]
  },
  linkMercer:{
    location:"Link Board",
    title:"Connection established",
    text:"The badge, boots, and Mercer's behavior make him a likely participant, but they don't prove he ordered the murder.",
    choices:[["Continue connecting clues", "board"]]
  },
  linkMallory:{
    location:"Link Board",
    title:"The missing piece",
    text:"The initials M.M., the compromised police radio, and the courier's meeting point toward Commissioner Mallory. If you followed the courier, you have direct confirmation.",
    choices:[["Make the final call", "final"]]
  },
  final:{
    location:"Gotham Police Headquarters",
    title:"Case 01: The Black Lantern",
    text:"You present the evidence. NIGHTFALL is exposed, the corruption inside the department becomes public, and Elias Vane's murder is officially reopened. Gotham is still dangerous—but tonight, you proved that the truth can survive the darkness.",
    choices:[["End the case", "end"]]
  }
};

function addEvidence(items=[]){
  items.forEach(x=>{if(!state.evidence.includes(x)) state.evidence.push(x)});
}
function minutesToTime(m){
  m%=1440; let h=Math.floor(m/60), min=m%60;
  let ap=h>=12?"PM":"AM"; let hh=h%12||12;
  return `${hh}:${String(min).padStart(2,"0")} ${ap}`;
}
function progress(){
  return Math.min(100, Math.round((state.evidence.length/10)*100));
}
function render(){
  if(state.done) return;
  const s=scenes[state.node];
  document.getElementById("location").textContent=s.location;
  document.getElementById("title").textContent=s.title;
  document.getElementById("text").textContent=s.text;
  document.getElementById("clues").innerHTML=(s.clues||[]).map(c=>`<div class="clue">${c}</div>`).join("");
  const choices=document.getElementById("choices");
  choices.innerHTML="";
  (s.choices||[]).forEach(([label,next])=>{
    const b=document.createElement("button");
    b.textContent=label;
    b.onclick=()=>choose(next);
    choices.appendChild(b);
  });
  document.getElementById("time").textContent=minutesToTime(state.time);
  document.getElementById("progress").textContent=progress()+"%";
  document.getElementById("progressBar").style.width=progress()+"%";
  document.getElementById("rep").textContent=state.rep;
  document.getElementById("evidence").innerHTML=state.evidence.length
    ? state.evidence.map(e=>`<span class="tag">${e}</span>`).join("")
    : '<span class="muted">Nothing yet.</span>';
  document.getElementById("board").innerHTML=state.links.length
    ? state.links.map(x=>`<div class="link">${x}</div>`).join("")
    : '<span class="muted">Connect clues to build a theory.</span>';
}
function choose(next){
  if(next==="end"){finish();return}
  if(next==="final"){
    if(state.links.includes("Murder → NIGHTFALL") && state.links.includes("Conspiracy → Commissioner Mallory")){
      state.node="final";
    }else{
      state.node="board";
      alert("You need stronger connections before making the final call.");
      render(); return;
    }
  }else if(next==="linkNightfall"){
    if(!state.links.includes("Murder → NIGHTFALL")) state.links.push("Murder → NIGHTFALL");
    state.rep+=1; state.node="board";
  }else if(next==="linkMercer"){
    if(!state.links.includes("Mercer → Crime Scene")) state.links.push("Mercer → Crime Scene");
    state.rep+=1; state.node="board";
  }else if(next==="linkMallory"){
    if(!state.links.includes("Conspiracy → Commissioner Mallory")) state.links.push("Conspiracy → Commissioner Mallory");
    state.rep+=2; state.node="board";
  }else{
    state.node=next;
  }
  state.time+=12;
  if(scenes[state.node]?.evidence) addEvidence(scenes[state.node].evidence);
  render();
}
function finish(){
  state.done=true;
  document.getElementById("game").classList.add("hidden");
  const end=document.getElementById("ending");
  end.classList.remove("hidden");
  end.innerHTML=`
    <div class="location">GOTHAM POLICE DEPARTMENT • FINAL REPORT</div>
    <h2>CASE FILE CLOSED</h2>
    <p class="success"><strong>The Black Lantern investigation is officially resolved.</strong></p>

    <div class="clue" style="text-align:left">
      <strong>THE CASE</strong><br>
      Victim: Elias Vane<br>
      Investigation: The Black Lantern Murder<br>
      Primary conspiracy: NIGHTFALL<br>
      Police involvement: Confirmed
    </div>

    <div class="clue" style="text-align:left">
      <strong>WHAT HAPPENED</strong><br>
      Elias Vane discovered NIGHTFALL's operation and attempted to expose it.
      Commissioner Mallory ordered his removal, while corrupt officers and a courier
      helped cover up the murder and protect the organization.
    </div>

    <div class="clue" style="text-align:left">
      <strong>YOUR INVESTIGATION</strong><br>
      Evidence collected: ${state.evidence.length}<br>
      Reputation earned: ${state.rep}<br>
      Key connections established: ${state.links.length}
    </div>

    <div class="clue" style="text-align:left">
      <strong>THE AFTERMATH</strong><br>
      By sunrise, the Black Lantern investigation had become one of the biggest
      scandals Gotham's police department had faced in years. NIGHTFALL's operation
      was exposed, corrupt officers were taken into custody, and Elias Vane's name
      was cleared.
    </div>

    <p style="margin:24px 10px;font-style:italic;font-size:17px">
      "The city would forget your name eventually. Gotham always does.
      But tonight, you reminded it that someone was watching."
    </p>

    <div style="margin-top:22px">
      <button onclick="newCase()" style="width:100%;text-align:center">
        RETURN TO CASE FILES
      </button>
    </div>
  `;
}

function newCase(){
  document.getElementById("ending").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  state.done=false;
  state.node="scene";
  state.time=23*60;
  state.rep=0;
  state.evidence=[];
  state.links=[];
  state.flags={};
  render();
}
document.getElementById("reset").onclick=()=>location.reload();
render();
</script>
</body>
</html>
